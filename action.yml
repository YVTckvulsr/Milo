name: 'Milo PR Health Check'
description: 'Zero-config AI-powered PR analysis — like a senior dev doing the first pass on every PR.'
author: 'yvtckvulsr'

inputs:
  github-token:
    description: 'GitHub token for posting comments'
    required: true
    default: ${{ github.token }}
  anthropic-api-key:
    description: 'Anthropic API key for AI-powered analysis (optional — enables summary, concerns, and split suggestions)'
    required: false
  fail-on-secrets:
    description: 'Fail the workflow if potential secrets are detected'
    required: false
    default: 'true'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'activity'
  color: 'blue'
