name: Milo Self Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  milo:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
